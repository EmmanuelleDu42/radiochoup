<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Choup</title>
  <link rel="stylesheet" href="radio-choup-hero.css" />
</head>
<body>
  <main class="radio-page">
    <section class="radio-hero" aria-label="Bienvenue sur Radio Choup">
      <picture class="radio-hero__visual">
        <source srcset="radio-choup-mobile-hero.webp" type="image/webp" />
        <img src="radio-choup-mobile-hero.webp" alt="Ancien poste radio turquoise Radio Choup posé sur une table en bois" />
      </picture>

      <div class="radio-hero__overlay" aria-hidden="true"></div>

      <div class="radio-hero__content">
        <p class="radio-hero__kicker">Radio Choup</p>
        <h1>Une ambiance rétro, douce et immédiatement reconnaissable.</h1>
        <p class="radio-hero__text">Un visuel vertical pensé pour un format mobile type iPhone X, avec une grande respiration au-dessus du poste pour accueillir un titre, un menu ou un appel à l’action.</p>
        <a class="radio-hero__button" href="#ecouter">Écouter maintenant</a>
      </div>
    </section>
  </main>
</body>
</html>
