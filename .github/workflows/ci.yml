name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        env:
          STREAM_TYPE: icecast
          STREAM_URL: https://example.com/stream
          STREAM_STATUS_URL: https://example.com/status-json.xsl
          VAGALUME_API_KEY: dummy
          NEXT_PUBLIC_SITE_URL: https://www.radiochoup.com
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        env:
          STREAM_TYPE: icecast
          STREAM_URL: https://icecast.cef-informatique.com:8443/stream
          STREAM_STATUS_URL: https://icecast.cef-informatique.com:8443/status-json.xsl
          VAGALUME_API_KEY: dummy
          NEXT_PUBLIC_SITE_URL: https://www.radiochoup.com
        run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
